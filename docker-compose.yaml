version: '3'

services:
  rooster_app:
    build:
      context: .
    container_name: rostar
    restart: unless-stopped
    ports:
      - '127.0.0.1:6080:6080'
    environment:
      - ROSTAR_USER=${ROSTAR_USER}
      - ROSTAR_PASS=${ROSTAR_PASS}
      - ROSTAR_OAUTH_PORT=6080
    volumes:
      - ./data:/data
